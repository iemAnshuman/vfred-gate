[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vfred-gate"
version = "0.1.0"
description = "Evidence-backed numerical compatibility qualification"
requires-python = ">=3.11"
dependencies = ["typer>=0.12", "pydantic>=2.7", "PyYAML>=6", "numpy>=1.26", "pyelftools>=0.31", "Jinja2>=3.1"]

[project.scripts]
vfg = "vfg.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/vfg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: requires the pinned model and compiled runner", "rvv: requires RVV tools and QEMU"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

