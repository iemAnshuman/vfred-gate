[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vfred-gate"
version = "1.0.0"
description = "Numerical compatibility gate for llama.cpp builds: verdict, first differing op, offline evidence"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11.4"
keywords = ["llama.cpp", "ggml", "numerical", "reproducibility", "risc-v", "rvv", "testing", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing",
]
dependencies = ["typer>=0.12", "pydantic>=2.7", "PyYAML>=6", "numpy>=1.26", "pyelftools>=0.31", "Jinja2>=3.1", "ninja>=1.11"]

[project.scripts]
vfg = "vfg.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[project.urls]
Homepage = "https://github.com/iemAnshuman/vfred-gate"
Issues = "https://github.com/iemAnshuman/vfred-gate/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/vfg"]

[tool.hatch.build.targets.wheel.force-include]
"CMakeLists.txt" = "vfg/_native/CMakeLists.txt"
"CMakePresets.json" = "vfg/_native/CMakePresets.json"
"runner" = "vfg/_native/runner"
"microbench" = "vfg/_native/microbench"
"third_party/llama.lock.json" = "vfg/_native/third_party/llama.lock.json"
"third_party/patches" = "vfg/_native/third_party/patches"
"models/model.lock.json" = "vfg/_native/models/model.lock.json"
"corpora/source/pilot.jsonl" = "vfg/_native/corpora/source/pilot.jsonl"
"scripts/flag_filter.py" = "vfg/_native/scripts/flag_filter.py"

[tool.hatch.build.targets.sdist]
include = ["src", "runner", "microbench", "CMakeLists.txt", "CMakePresets.json", "third_party/llama.lock.json",
  "third_party/patches", "models/model.lock.json", "corpora/source", "scripts/flag_filter.py", "tests", "README.md",
  "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: requires the pinned model and compiled runner", "rvv: requires RVV tools and QEMU"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

